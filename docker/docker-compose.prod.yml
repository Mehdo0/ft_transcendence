services:
  backend:
    image: ${BACKEND_IMAGE:-drawmeter-backend}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    networks:
      - trsc_net
    secrets:
      - secret_key

  backup:
    image: ${BACKEND_IMAGE:-drawmeter-backend}
    restart: unless-stopped
    network_mode: none
    command: ["python", "-m", "maintenance.database_backup"]
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:ro
      - ../backups:/app/backups
    depends_on:
      - backend

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx.Dockerfile
      args:
        NGINX_CONFIG: docker/nginx/production.conf
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT must be configured}:80"
    depends_on:
      - backend
    networks:
      - trsc_net

networks:
  trsc_net:
    driver: bridge

secrets:
  secret_key:
    file: ../secrets/secret_key
